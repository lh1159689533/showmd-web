<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JavaScript测试工具</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans',
          'Helvetica Neue', sans-serif;
      }

      body {
        background-color: #f6f6f6;
        color: #333;
        line-height: 1.6;
        padding: 20px;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }

      .notebook-container {
        width: 95%;
        max-width: 1000px;
        background: white;
        border-radius: 6px;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
        overflow: hidden;
        transition: all 0.3s ease;
      }

      .tool-header {
        display: flex;
        align-items: center;
        background-color: #f7f7f7;
        padding: 15px 25px;
        border-bottom: 1px solid #e0e0e0;
      }

      .tool-title {
        font-size: 18px;
        font-weight: 600;
        color: #333;
        margin-right: auto;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .tool-title i {
        color: #0078d4;
        font-size: 22px;
      }

      .control-buttons {
        display: flex;
        gap: 12px;
      }

      .control-btn {
        background: #0078d4;
        color: white;
        border: none;
        padding: 8px 18px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 15px;
        display: flex;
        align-items: center;
        gap: 8px;
        transition: all 0.2s ease;
        box-shadow: 0 2px 5px rgba(0, 120, 212, 0.3);
      }

      .control-btn:hover {
        background: #106ebe;
        transform: translateY(-2px);
        box-shadow: 0 4px 8px rgba(0, 120, 212, 0.4);
      }

      .control-btn:active {
        transform: translateY(0);
      }

      .control-btn.reset {
        background: #605e5c;
        box-shadow: 0 2px 5px rgba(96, 94, 92, 0.2);
      }

      .control-btn.reset:hover {
        background: #4b4947;
      }

      .cell {
        padding: 20px 25px 10px 25px;
      }

      .input-container {
        position: relative;
        margin-bottom: 20px;
      }

      .execution-count {
        position: absolute;
        top: 10px;
        left: 10px;
        color: #5f5f5f;
        font-size: 14px;
        background: rgba(247, 247, 247, 0.8);
        padding: 4px 12px;
        border-radius: 3px;
        font-weight: 600;
        border: 1px solid #e0e0e0;
      }

      .code-input {
        width: 100%;
        min-height: 150px;
        padding: 50px 15px 20px 15px;
        background: #f8f8f8;
        border: 1px solid #dcdcdc;
        border-radius: 4px;
        resize: vertical;
        font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
        font-size: 15px;
        line-height: 1.6;
        box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.05);
        transition: all 0.3s ease;
      }

      .code-input:focus {
        outline: none;
        border-color: #0078d4;
        box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.05), 0 0 0 2px rgba(0, 120, 212, 0.2);
      }

      .output-container {
        display: none; /* 初始隐藏输出区域 */
        position: relative;
        margin-top: 25px;
        border-radius: 4px;
        overflow: hidden;
        border: 1px solid #e0e0e0;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        transition: all 0.3s ease;
      }

      .output-header {
        display: flex;
        align-items: center;
        padding: 12px 15px;
        background-color: #f8f8f8;
        border-bottom: 1px solid #e0e0e0;
        font-size: 15px;
        color: #5f5f5f;
        font-weight: 500;
      }

      .execution-status {
        margin-left: auto;
        font-size: 14px;
        color: #0078d4;
        font-weight: 600;
      }

      .error-status {
        color: #e51400;
      }

      .success-status {
        color: #107c10;
      }

      .output-content {
        background: white;
        min-height: 100px;
        max-height: 400px;
        overflow: auto;
        padding: 15px;
        font-family: monospace;
        font-size: 14px;
        white-space: pre-wrap;
      }

      .error-trace {
        margin-bottom: 20px;
      }

      .error-header {
        color: #e51400;
        font-weight: 700;
        margin-bottom: 10px;
        font-size: 16px;
      }

      .traceback-header {
        color: #5f5f5f;
        font-weight: 600;
        margin-bottom: 12px;
        font-size: 15px;
      }

      .code-cell-ref {
        margin-bottom: 12px;
      }

      .cell-link {
        color: #0078d4;
        text-decoration: none;
        margin-right: 8px;
        font-weight: 600;
      }

      .cell-link:hover {
        text-decoration: underline;
      }

      .code-fragment {
        padding: 8px 0;
        margin-left: 25px;
        position: relative;
      }

      .code-line {
        padding-left: 40px;
        position: relative;
        white-space: pre;
      }

      .line-number {
        position: absolute;
        left: 0;
        width: 35px;
        text-align: right;
        color: #5f5f5f;
        font-weight: 500;
      }

      .highlighted {
        background-color: rgba(255, 227, 0, 0.2);
        display: block;
        padding: 5px 10px;
        border-radius: 3px;
        margin: 0 -10px;
      }

      .stdout-line {
        color: #333;
        padding: 5px 0;
        line-height: 1.6;
        font-size: 15px;
      }

      .status-bar {
        padding: 12px 25px;
        background-color: #f7f7f7;
        border-top: 1px solid #e0e0e0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 13px;
        color: #5f5f5f;
      }

      .execution-time {
        font-weight: 500;
        color: #0078d4;
        font-size: 14px;
      }

      .info-message {
        background: #e0f3ff;
        border-radius: 4px;
        padding: 15px;
        margin: 15px 0;
        font-size: 14px;
        color: #0078d4;
        border-left: 4px solid #0078d4;
      }

      .info-message i {
        margin-right: 8px;
        font-size: 16px;
      }

      /* VS Code风格语法高亮 */
      .code-input .keyword {
        color: #0000ff;
        font-weight: normal;
      }
      .code-input .function {
        color: #795e26;
      }
      .code-input .string {
        color: #a31515;
      }
      .code-input .comment {
        color: #008000;
        font-style: italic;
      }
      .code-input .bracket {
        color: #ff0000;
      }
      .code-input .number {
        color: #098658;
      }
      .code-input .operator {
        color: #000000;
      }

      /* 自定义滚动条 */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }

      ::-webkit-scrollbar-track {
        background: #f1f1f1;
        border-radius: 4px;
      }

      ::-webkit-scrollbar-thumb {
        background: #c5c5c5;
        border-radius: 4px;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: #a5a5a5;
      }
    </style>
  </head>
  <body>
    <div class="notebook-container">
      <div class="tool-header">
        <div class="tool-title"><i class="fas fa-code"></i> JavaScript测试工具</div>
        <div class="control-buttons">
          <button class="control-btn" id="runBtn"><i class="fas fa-play"></i> 运行代码</button>
          <button class="control-btn reset" id="resetBtn"><i class="fas fa-redo"></i> 重置</button>
        </div>
      </div>

      <div class="cell">
        <div class="input-container">
          <span class="execution-count">Cell In [1]</span>
          <textarea class="code-input" id="codeInput" spellcheck="false">
// JavaScript代码测试工具
// console.log 会在下方显示输出
console.log("Hello World!");

// 函数示例
function calculateCircleArea(radius) {
    return Math.PI * radius * radius;
}

console.log("半径为5的圆面积: " + calculateCircleArea(5).toFixed(2));

// 取消下面一行的注释查看错误效果
// console.log(undefinedVariable);</textarea
          >
        </div>

        <div class="info-message">
          <i class="fas fa-info-circle"></i> 提示：按 Ctrl+Enter 或点击"运行代码"按钮执行代码
        </div>

        <div class="output-container" id="outputContainer">
          <div class="output-header">
            <span>输出</span>
            <div class="execution-status" id="executionStatus">就绪</div>
          </div>
          <div class="output-content" id="outputContent">
            <!-- 输出内容将通过脚本填充 -->
          </div>
        </div>
      </div>

      <div class="status-bar">
        <div>JavaScript测试环境 v1.0</div>
        <div class="execution-time" id="executionTime"></div>
      </div>
    </div>

    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const codeInput = document.getElementById('codeInput');
        const runBtn = document.getElementById('runBtn');
        const resetBtn = document.getElementById('resetBtn');
        const outputContainer = document.getElementById('outputContainer');
        const outputContent = document.getElementById('outputContent');
        const executionStatus = document.getElementById('executionStatus');
        const executionTime = document.getElementById('executionTime');

        // 设置高亮函数
        function highlightSyntax() {
          const keywords = ['function', 'if', 'else', 'return', 'for', 'while', 'const', 'let', 'var', 'class'];
          const code = codeInput.value;

          // 清除已有高亮
          codeInput.innerHTML = '';

          // 创建带有高亮的文本
          const highlightedCode = code
            .replace(/(".*?"|'.*?')/g, '<span class="string">$1</span>')
            .replace(/\/\/.*/g, '<span class="comment">$&</span>')
            .replace(new RegExp(`\\b(${keywords.join('|')})\\b`, 'g'), '<span class="keyword">$1</span>')
            .replace(/\b(function)\b/g, '<span class="function">$1</span>')
            .replace(/(\d+)/g, '<span class="number">$1</span>')
            .replace(/[=+\-*/%<>!&|\^~=]/g, '<span class="operator">$&</span>')
            .replace(/[{}()[\];:]/g, '<span class="bracket">$&</span>');

          // 设置高亮文本
          codeInput.innerHTML = highlightedCode;
        }

        // 初始高亮
        highlightSyntax();

        // 当输入变化时重新高亮
        codeInput.addEventListener('input', highlightSyntax);

        // 原始控制台方法备份
        const originalConsole = {
          log: console.log,
          warn: console.warn,
          error: console.error,
          info: console.info,
        };

        // 执行代码
        function executeCode() {
          // 重置状态
          outputContent.innerHTML = '';
          outputContainer.style.display = 'block'; // 显示输出容器
          executionStatus.textContent = '执行中...';
          executionStatus.className = 'execution-status';
          executionTime.textContent = '';

          // 开始计时
          const startTime = performance.now();

          // 错误标志
          let hasError = false;

          // 捕获控制台输出
          console.log = function (...args) {
            originalConsole.log(...args);
            const line = document.createElement('div');
            line.className = 'stdout-line';
            line.textContent = args.join(' ');
            outputContent.appendChild(line);
          };

          console.info = function (...args) {
            originalConsole.info(...args);
            const line = document.createElement('div');
            line.className = 'stdout-line';
            line.textContent = args.join(' ');
            outputContent.appendChild(line);
          };

          console.warn = function (...args) {
            originalConsole.warn(...args);
            const line = document.createElement('div');
            line.className = 'stdout-line';
            line.style.color = '#c75109';
            line.textContent = '警告: ' + args.join(' ');
            outputContent.appendChild(line);
          };

          console.error = function (...args) {
            originalConsole.error(...args);
            hasError = true;

            // 创建错误跟踪区块
            const errorSection = document.createElement('div');
            errorSection.className = 'error-trace';

            // 错误标题
            const errorHeader = document.createElement('div');
            errorHeader.className = 'error-header';
            errorHeader.textContent = 'NameError';
            errorSection.appendChild(errorHeader);

            // Traceback标题
            const traceHeader = document.createElement('div');
            traceHeader.className = 'traceback-header';
            traceHeader.textContent = 'Traceback (most recent call last)';
            errorSection.appendChild(traceHeader);

            // 添加代码单元格引用
            const cellRef = document.createElement('div');
            cellRef.className = 'code-cell-ref';
            cellRef.innerHTML = `
                        <span>Cell In[1],</span>
                        <a class="cell-link" href="javascript:void(0);">line 8</a>
                    `;
            errorSection.appendChild(cellRef);

            // 添加错误行
            const errorFragment = document.createElement('div');
            errorFragment.className = 'code-fragment';

            // 添加相关代码行（正常行）
            const line7 = document.createElement('div');
            line7.className = 'code-line';
            line7.innerHTML = `
                        <span class="line-number">7</span>
                        <span>dlcutils.params.text(name='zz', defaultValue='1')</span>
                    `;
            errorFragment.appendChild(line7);

            // 添加错误行（高亮显示）
            const line8 = document.createElement('div');
            line8.className = 'code-line';
            line8.innerHTML = `
                        <span class="line-number">8</span>
                        <span class="highlighted">console.log("Hello World!");</span>
                    `;
            errorFragment.appendChild(line8);

            errorSection.appendChild(errorFragment);

            // 添加错误信息
            const errorMessage = document.createElement('div');
            errorMessage.style.marginTop = '15px';
            errorMessage.style.color = '#e51400';
            errorMessage.textContent = 'NameError: undefinedVariable is not defined';
            errorSection.appendChild(errorMessage);

            // 插入到输出容器的开头
            outputContent.insertBefore(errorSection, outputContent.firstChild);
          };

          // 获取用户代码
          const code = codeInput.textContent || codeInput.innerText;

          try {
            // 安全沙箱执行环境
            const safeEval = new Function(`
                        "use strict";
                        const safeContext = {
                            console: console,
                            setTimeout: null,
                            setInterval: null,
                            clearTimeout: null,
                            clearInterval: null,
                            XMLHttpRequest: null,
                            fetch: null,
                            document: null,
                            window: null,
                            history: null,
                            location: null,
                            localStorage: null,
                            sessionStorage: null
                        };
                        
                        with(safeContext) {
                            try {
                                ${code}
                            } catch (e) {
                                console.error(e.name + ": " + e.message);
                            }
                        }
                    `);

            // 执行代码
            safeEval();

            // 计算执行时间
            const endTime = performance.now();
            const execTime = (endTime - startTime).toFixed(2);
            executionTime.textContent = `执行时间: ${execTime}ms`;

            // 更新状态
            executionStatus.textContent = '执行成功';
            executionStatus.className = 'execution-status success-status';
          } catch (e) {
            // 计算执行时间
            const endTime = performance.now();
            const execTime = (endTime - startTime).toFixed(2);
            executionTime.textContent = `执行时间: ${execTime}ms`;

            // 更新状态
            executionStatus.textContent = '执行错误';
            executionStatus.className = 'execution-status error-status';

            if (!hasError) {
              // 创建错误信息
              const errorMessage = document.createElement('div');
              errorMessage.className = 'error-header';
              errorMessage.textContent = `错误: ${e.name}: ${e.message}`;
              outputContent.appendChild(errorMessage);
            }
          } finally {
            // 恢复原始控制台方法
            console.log = originalConsole.log;
            console.warn = originalConsole.warn;
            console.error = originalConsole.error;
            console.info = originalConsole.info;

            // 滚动到底部
            outputContainer.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
          }
        }

        // 重置编辑器
        function resetEditor() {
          codeInput.textContent = `// JavaScript代码测试工具
// console.log 会在下方显示输出
console.log("Hello World!");

// 函数示例
function calculateCircleArea(radius) {
    return Math.PI * radius * radius;
}

console.log("半径为5的圆面积: " + calculateCircleArea(5).toFixed(2));

// 取消下面一行的注释查看错误效果
// console.log(undefinedVariable);`;

          // 重置状态
          outputContainer.style.display = 'none';
          outputContent.innerHTML = '';
          executionStatus.textContent = '就绪';
          executionStatus.className = 'execution-status';
          executionTime.textContent = '';

          // 重新高亮
          highlightSyntax();
        }

        // 绑定按钮事件
        runBtn.addEventListener('click', executeCode);
        resetBtn.addEventListener('click', resetEditor);

        // 添加Ctrl+Enter快捷键支持
        document.addEventListener('keydown', (e) => {
          if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
            executeCode();
            e.preventDefault();
          }
        });

        // 初始高亮
        highlightSyntax();
      });
    </script>
  </body>
</html>
