<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    * {
      padding: 0;
      margin: 0;
    }
    body {
      background: linear-gradient(135deg, var(--c1), var(--c2), var(--c3));
    }
    .imgs {
      padding: 200px 400px;
      width: 100vw;
      height: 100vh;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      box-sizing: border-box;
      gap: 80px;
    }
    .img {
      background-repeat: no-repeat;
      background-size: 100% 100%;
      transition: transform 300ms;
    }
    .img:hover {
      transform: scale(1.2);
      box-shadow: 1px 1px 8px #000, 1px 0 8px #555;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/color-thief/2.3.0/color-thief.umd.js"></script>
</head>
<body>
  <div class="imgs">
    <img src="./images/image1.png" class="img"></img>
    <img src="./images/image2.png" class="img"></img>
    <img src="./images/image3.png" class="img"></img>
    <img src="./images/image4.png" class="img"></img>
  </div>
  <script>
    /**
     * body背景色随选中的图片变化
     */
    const colorThief = new ColorThief();
    const imgs = document.querySelectorAll('.imgs .img');
    let timer = null;
    imgs.forEach((dom) => {
      dom.addEventListener('mouseenter', async (e) => {
        clearTimeout(timer);
        const colors = await colorThief.getPalette(e.target, 3);
        const [c1, c2, c3] = colors.map(item => `rgb(${item[0]}, ${item[1]}, ${item[2]})`);
        document.documentElement.style.setProperty('--c1', c1);
        document.documentElement.style.setProperty('--c2', c2);
        document.documentElement.style.setProperty('--c3', c3);
      });
      dom.addEventListener('mouseleave', (e) => {
        timer = setTimeout(() => {
          document.documentElement.style.setProperty('--c1', '#fff');
          document.documentElement.style.setProperty('--c2', '#fff');
          document.documentElement.style.setProperty('--c3', '#fff');
        }, 300)
      });
    });
  </script>
</body>
</html>
